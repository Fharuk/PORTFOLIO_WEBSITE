name: Deploy to GitHub Pages

# Second public home for the portfolio, alongside Vercel.
#
# Vercel builds the default Next.js server output; this job builds the static
# export (STATIC_EXPORT=1) and publishes `out/` as a Pages artifact. No
# `gh-pages` branch is involved — actions/deploy-pages uploads the artifact.

on:
  push:
    branches:
      - arena/778253f2-portfolio-website
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # No `enablement` input: enabling Pages needs a token with admin rights,
      # and GITHUB_TOKEN is refused there. Pages is enabled on the repo itself
      # (Settings -> Pages -> Source: GitHub Actions), so this only reads config.
      - uses: actions/configure-pages@v6

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: '1'
          STATIC_BASE_PATH: /${{ github.event.repository.name }}
          # Origin for canonical/OpenGraph/sitemap. Without it metadataBase falls
          # back to localhost on this host and the share card points nowhere.
          NEXT_PUBLIC_SITE_URL: https://fharuk.github.io

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
