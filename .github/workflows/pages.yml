name: Deploy to GitHub Pages

# Second public home for the portfolio, alongside Vercel.
#
# Vercel builds the default Next.js server output; this job builds the static
# export (STATIC_EXPORT=1) and publishes the resulting `out/` directory as a
# Pages artifact. No `gh-pages` branch is involved — actions/deploy-pages
# uploads the artifact directly.
#
# Note the base path: a project site lives at /<repo>/, so every asset URL has
# to be prefixed or the CSS, chunks and portrait 404.

on:
  push:
    branches:
      - arena/778253f2-portfolio-website
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # enablement:true means the first run turns Pages on by itself, so there
      # is no separate Settings -> Pages step. Requires a public repo on the
      # Free plan; on a private repo it needs Pro or above.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: '1'
          STATIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
